name: Feature request
description: Suggest a change or an addition to Showrunner.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open this issue **before** writing any code. A quick conversation here saves you from building something that turns out to be already in progress, out of scope, or easier to do a different way.

        See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for what's in and out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're in, not the solution you have in mind. This is the most useful part of the request.
      placeholder: |
        I watch a lot of shows that air weekly, and I keep losing track of which ones have a new episode I haven't seen. The Up Next page shows everything at once, so overdue shows get buried.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: If you have a specific solution in mind, describe it here.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including "I tried X and it didn't work because Y."

  - type: checkboxes
    id: willing
    attributes:
      label: Would you like to implement this?
      options:
        - label: I'd be willing to open a PR for this if we agree on the approach.
