name: Supply chain scan

on:
  workflow_call:
    secrets:
      # Not marked required: bot-authored PRs (Dependabot, Renovate) run without
      # access to repository secrets. With required: true the reusable-workflow
      # call hard-fails before the job starts. Keeping it optional lets those PRs
      # run the rest of the scan; the Socket step below self-skips when absent.
      SOCKET_SECURITY_API_KEY:
        required: false

jobs:
  # @spec SHIP-SUPPLY-001
  scan:
    name: Scan
    runs-on: ubuntu-latest
    # @spec SHIP-CI-003
    permissions:
      contents: read
    # Job-level env so the Socket step's `if:` can test for the secret's
    # presence (step-level env isn't available to that step's own `if:`, and
    # the `secrets` context can't be used in an `if:` directly).
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (no scripts)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Verify npm package signatures
        working-directory: frontend
        run: npm audit signatures

      - name: Socket Security scan (frontend)
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        # Pinned exact version: `@latest` fetches and executes arbitrary code in
        # a job that holds SOCKET_SECURITY_API_KEY. Renovate bumps this.
        run: |
          repo_slug="${GITHUB_REPOSITORY##*/}"
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          npx -y @socketsecurity/cli@1.1.102 scan create \
            --org grecolabs \
            --repo "${repo_slug}" \
            --branch "${branch_name}" \
            --report \
            ./frontend

      # --- OSV scanning -------------------------------------------------------
      # Two modes, chosen by event:
      #   * pull_request: DIFF mode. Scan the base branch's lockfiles and the
      #     PR's lockfiles, then fail only on vulnerabilities the PR *introduces*.
      #     An advisory that lands against a dependency already on main no
      #     longer blocks unrelated PRs (what stalled #128/#130 on
      #     GHSA-68fv-2mgg-jv7q).
      #   * push to main / schedule: ABSOLUTE mode. Fail on any known
      #     vulnerability so main's state stays visible. ci.yml calls this
      #     workflow on a weekly schedule for exactly that purpose.
      #
      # Both lockfiles (frontend/package-lock.json, backend/Cargo.lock) are
      # listed explicitly rather than scanned with --recursive, because the
      # base-branch copies live under .osv-base/ inside the workspace and a
      # recursive scan of ./ would pick those up too. The copies keep their
      # directory layout so OSV-Scanner finds the sibling osv-scanner.toml
      # ignore list for each lockfile, same as on the PR side.
      #
      # Both scanner invocations exit non-zero when they find vulnerabilities,
      # so they run with continue-on-error and the reporter step decides the
      # verdict. A scan that fails outright writes no JSON; the "both scans
      # completed" check refuses to compare in that case rather than passing a
      # broken scan as clean. All files live in the workspace: the scanner and
      # reporter are Docker actions that mount only $GITHUB_WORKSPACE.

      # @spec SHIP-SUPPLY-002
      - name: Fetch base-branch lockfiles (PR diff mode)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          mkdir -p .osv-base/frontend .osv-base/backend
          git show "FETCH_HEAD:frontend/package-lock.json" > .osv-base/frontend/package-lock.json
          git show "FETCH_HEAD:backend/Cargo.lock" > .osv-base/backend/Cargo.lock
          # Per-lockfile ignore lists; tolerate their absence on the base branch.
          git show "FETCH_HEAD:frontend/osv-scanner.toml" > .osv-base/frontend/osv-scanner.toml 2>/dev/null || rm -f .osv-base/frontend/osv-scanner.toml
          git show "FETCH_HEAD:backend/osv-scanner.toml" > .osv-base/backend/osv-scanner.toml 2>/dev/null || rm -f .osv-base/backend/osv-scanner.toml

      - name: OSV scan base lockfiles (PR diff mode)
        id: scan-old
        if: ${{ github.event_name == 'pull_request' }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output-file=osv-old.json
            --lockfile=.osv-base/frontend/package-lock.json
            --lockfile=.osv-base/backend/Cargo.lock

      - name: OSV scan PR lockfiles (PR diff mode)
        id: scan-new
        if: ${{ github.event_name == 'pull_request' }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output-file=osv-new.json
            --lockfile=frontend/package-lock.json
            --lockfile=backend/Cargo.lock

      - name: Check that both scans completed (PR diff mode)
        if: ${{ github.event_name == 'pull_request' && (steps.scan-old.outcome == 'failure' || steps.scan-new.outcome == 'failure') }}
        env:
          OLD_RESULTS: osv-old.json
          NEW_RESULTS: osv-new.json
        run: |
          status=0
          if [ ! -s "${OLD_RESULTS}" ]; then
            echo "::error::OSV-Scanner failed on the base lockfiles without writing results."
            status=1
          fi
          if [ ! -s "${NEW_RESULTS}" ]; then
            echo "::error::OSV-Scanner failed on this PR's lockfiles without writing results."
            status=1
          fi
          exit "${status}"

      - name: Report vulnerabilities introduced by this PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --old=osv-old.json
            --new=osv-new.json
            --gh-annotations=true
            --fail-on-vuln=true

      # @spec SHIP-SUPPLY-003
      - name: OSV scan (absolute, main / scheduled)
        if: ${{ github.event_name != 'pull_request' }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

      # --- cargo audit (absolute runs only) -----------------------------------
      # Runs with the absolute OSV pass, never on pull requests. OSV diff mode
      # above already scans Cargo.lock against the RustSec advisories, so an
      # absolute cargo audit here would fail every open PR the day an advisory
      # lands against a crate already on main (what stalled #176/#177 on
      # RUSTSEC-2026-0382/0383). On main and the weekly schedule it stays as a
      # second reader of the same lockfile. The toolchain and install steps are
      # gated too so a PR run skips all three.
      # @spec SHIP-SUPPLY-003
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ github.event_name != 'pull_request' }}

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        if: ${{ github.event_name != 'pull_request' }}
        with:
          tool: cargo-audit

      - name: cargo audit (backend)
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: backend
        run: cargo audit
