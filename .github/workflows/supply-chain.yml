name: Supply chain scan

on:
  workflow_call:
    secrets:
      # Not marked required: bot-authored PRs (Dependabot, Renovate) run without
      # access to repository secrets. With required: true the reusable-workflow
      # call hard-fails before the job starts. Keeping it optional lets those PRs
      # run the rest of the scan; the Socket step below self-skips when absent.
      SOCKET_SECURITY_API_KEY:
        required: false

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Job-level env so the Socket step's `if:` can test for the secret's
    # presence (step-level env isn't available to that step's own `if:`, and
    # the `secrets` context can't be used in an `if:` directly).
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (no scripts)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Verify npm package signatures
        working-directory: frontend
        run: npm audit signatures

      - name: Socket Security scan (frontend)
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        # Pinned exact version: `@latest` fetches and executes arbitrary code in
        # a job that holds SOCKET_SECURITY_API_KEY. Renovate bumps this.
        run: |
          repo_slug="${GITHUB_REPOSITORY##*/}"
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          npx -y @socketsecurity/cli@1.1.102 scan create \
            --org grecolabs \
            --repo "${repo_slug}" \
            --branch "${branch_name}" \
            --report \
            ./frontend

      - name: OSV scan (npm + cargo lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit

      - name: cargo audit (backend)
        working-directory: backend
        run: cargo audit
