name: CI

# @spec SHIP-CI-001, SHIP-CI-004
on:
  pull_request:
    branches: [main]
  # Pushes to main and v* tags run these gates inside docker-publish.yml (its
  # `ci` job calls this workflow), so a publish cannot start until they pass
  # and a merge does not run them twice.
  workflow_call:
  # Weekly absolute supply-chain scan of main. PR scans run in OSV diff mode
  # (only vulnerabilities a PR introduces fail it), so this is what surfaces an
  # advisory that lands against already-merged dependencies.
  # @spec SHIP-CI-004
  schedule:
    - cron: "0 13 * * 1" # Mondays 09:00 America/New_York (13:00 UTC)

# Least privilege: CI only needs to read the repo. Renovate keeps the pinned
# action SHAs below current (helpers:pinGitHubActionDigests).
# @spec SHIP-CI-003
permissions:
  contents: read

jobs:
  # @spec SHIP-CI-001
  backend:
    name: Backend (Rust)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Lint with Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests with coverage
        working-directory: backend
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 85

      # @spec SHIP-CI-002
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-lcov
          path: backend/lcov.info
          if-no-files-found: ignore

  # @spec SHIP-CI-001
  frontend:
    name: Frontend (React/TypeScript)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint and check formatting
        run: npx biome ci .

      - name: Run tests with coverage
        run: npm run test:coverage

      # @spec SHIP-CI-002
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-lcov
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  # Schedule-only: on push and pull_request the scan already runs via
  # docker-publish.yml, so gating here avoids a duplicate check.
  # @spec SHIP-CI-004, SHIP-SUPPLY-003
  supply-chain:
    name: Supply chain
    if: ${{ github.event_name == 'schedule' }}
    uses: ./.github/workflows/supply-chain.yml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
